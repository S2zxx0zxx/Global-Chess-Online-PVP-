<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#29151b"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Global Chess Online PvP</title></head><body><main><header><strong>GLOBAL CHESS</strong><span>Online PvP</span></header><section class="layout"><aside><h1>Play chess</h1><label class="time-control">Time control <select id="preset"><option value="untimed">Untimed</option><option value="quick">Quick · 5 min</option><option value="classic">Classic · 15 min</option></select></label><label class="time-control">Computer difficulty <select id="difficulty"><option value="standard">Standard</option><option value="easy">Easy</option></select></label><div class="actions"><button id="local">Local friend</button><button id="computer">Vs computer</button></div><div id="clocks" hidden></div><button id="history-button" type="button">Match history</button><section class="actions"><button id="online-create">Create private room</button><button id="online-rejoin" hidden>Reconnect to room</button><button id="online-leave" hidden>Return to offline game</button><a id="online-invite" hidden>Open invite link</a><button id="online-copy" hidden>Copy invite link</button><p id="online-status" role="status"></p></section><p id="status" role="status"></p><button id="claim" hidden>Claim draw</button><ol id="moves"></ol></aside><section><button id="view" type="button">Use 3D board</button><canvas id="scene" hidden aria-label="3D chessboard"></canvas><div id="board" class="board" aria-label="Chessboard"></div></section></section><dialog id="history-dialog"><form method="dialog"><button>Close</button></form><h2>Match history</h2><div class="backup-actions"><button id="export-backup" type="button">Export backup</button><button id="import-backup" type="button">Import backup</button><input id="backup-file" type="file" accept=".json,application/json" hidden><p id="backup-status" role="status"></p></div><div id="history-list"></div><section id="replay" hidden><h3>Replay</h3><p id="replay-position"></p><div id="replay-board" class="board"></div><button id="previous" type="button">Previous</button><button id="export-pgn" type="button">Export PGN</button><button id="next" type="button">Next</button></section></dialog><dialog id="claim-dialog"><h2>Claim a draw</h2><div id="claim-options"></div><form method="dialog"><button>Cancel</button></form></dialog><dialog id="promotion"><form method="dialog"><h2>Promote pawn</h2><button value="q">Queen</button><button value="r">Rook</button><button value="b">Bishop</button><button value="n">Knight</button></form></dialog></main><script type="module" src="/src/main.js"></script></body></html>
