name: Global Chess verification

on:
  pull_request:
  push:
    branches:
      - main
      - feat/playable-chess-foundation
      - feat/chess-v3-m0-mobile-shell
      - fix/chess-v3-offline-save-recovery
      - fix/chess-v3-bot-content-correctness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-chess-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Core tests, browser build, and WASM preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source syntax
        run: |
          find src server scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run automated tests
        run: npm test
      - name: Verify starter learning content and versioned audit manifest
        run: node scripts/validate-learning-pack.mjs
      - name: Build production PWA
        run: npm run build
      - name: Enforce 3D bundle performance budget
        run: node scripts/check-bundle-budget.js
      - name: Smoke-test playable 2D and mounted 3D in Chromium
        run: node scripts/smoke-browser.mjs
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chess-browser-smoke
          path: |
            artifacts/*.png
            artifacts/learning-audit.json
          if-no-files-found: ignore
      - name: Prepare Cloudflare WASM asset
        run: |
          node scripts/prepare-worker-solver.js
          node -e "const fs=require('node:fs');if(!WebAssembly.validate(fs.readFileSync('server/cha.generated.wasm')))process.exit(1)"
      - name: Confirm offline shell and solver files
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/_headers
          node -e "const fs=require('node:fs');const sw=fs.readFileSync('dist/sw.js','utf8');if(!sw.includes('SKIP_WAITING')||!sw.includes('clients.claim'))process.exit(1)"
          test -s dist/manifest.webmanifest
          test -s dist/solver/cha.wasm.gz
          test -s public/solver/LICENSE.txt
