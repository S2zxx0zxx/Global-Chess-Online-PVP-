name: Global Chess verification

on:
  pull_request:
    branches:
      - main
      - feat/playable-chess-foundation
      - feat/chess-release-integration
  push:
    branches:
      - main
      - feat/playable-chess-foundation
      - feat/original-royal-design-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-chess-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Core tests, browser build, and WASM preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source syntax
        run: |
          find src server scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run automated tests
        run: npm test
      - name: Build production PWA
        run: npm run build
      - name: Check packaged board and piece artwork
        run: node scripts/check-original-art.mjs
      - name: Validate offline lesson and puzzle pack
        run: node scripts/validate-learning-pack.mjs
      - name: Enforce 3D bundle performance budget
        run: node scripts/check-bundle-budget.js
      - name: Smoke-test playable 2D and mounted 3D in Chromium
        run: node scripts/smoke-browser.mjs
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-browser-smoke
          path: artifacts/
          if-no-files-found: ignore
      - name: Prepare Cloudflare WASM asset
        run: |
          node scripts/prepare-worker-solver.js
          node -e "const fs=require('node:fs');if(!WebAssembly.validate(fs.readFileSync('server/cha.generated.wasm')))process.exit(1)"
      - name: Confirm offline shell and solver files
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/solver/cha.wasm.gz
          test -s public/solver/LICENSE.txt
      - name: Smoke-test two seats on local Workers runtime
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node node_modules/wrangler/bin/wrangler.js dev --local --ip 127.0.0.1 --port 8787 --persist-to "$RUNNER_TEMP/chess-rooms" > "$RUNNER_TEMP/chess-worker.log" 2>&1 &
          worker=$!
          trap 'kill "$worker" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/ --output /dev/null; then
              node scripts/smoke-local-rooms.mjs
              exit $?
            fi
            if ! kill -0 "$worker" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/chess-worker.log"
          exit 1
